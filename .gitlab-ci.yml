stages:
  - verify
  - build
  - deploy

runner-docker-verify:
  stage: verify
  tags:
    - infra-docker
  script:
    - 'echo "Runner: ${CI_RUNNER_DESCRIPTION}"'
    - docker version
    - docker info

harbor-auth-verify:
  stage: verify
  tags:
    - infra-docker
  script:
    - echo "$HARBOR_PASSWORD" | docker login --username "$HARBOR_USER" --password-stdin 172.25.254.105
    - docker logout 172.25.254.105

build-and-push-image:
  stage: build
  tags:
    - infra-docker
  script:
    - export IMAGE="172.25.254.105/cloudshop/cloudshop-ci-test:${CI_COMMIT_SHORT_SHA}"
    - echo "$HARBOR_PASSWORD" | docker login --username "$HARBOR_USER" --password-stdin 172.25.254.105
    - docker build -t "$IMAGE" cicd/image-test
    - docker push "$IMAGE"
    - docker logout 172.25.254.105

deploy-to-kubernetes:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  tags:
    - infra-docker
  script:
    - export KUBECONFIG=/tmp/cloudshop-kubeconfig
    - export IMAGE="172.25.254.105/cloudshop/cloudshop-ci-test:${CI_COMMIT_SHORT_SHA}"
    - kubectl set image deployment/cloudshop-ci-test nginx="$IMAGE" -n cloudshop-ci
    - kubectl rollout status deployment/cloudshop-ci-test -n cloudshop-ci --timeout=120s
    - kubectl get deployment cloudshop-ci-test -n cloudshop-ci -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

stages:
  - verify
  - build
  - deploy

runner-docker-verify:
  stage: verify
  tags:
    - infra-docker
  script:
    - 'echo "Runner: ${CI_RUNNER_DESCRIPTION}"'
    - docker version
    - docker info

harbor-auth-verify:
  stage: verify
  tags:
    - infra-docker
  script:
    - echo "$HARBOR_PASSWORD" | docker login --username "$HARBOR_USER" --password-stdin 172.25.254.105
    - docker logout 172.25.254.105

build-and-push-image:
  stage: build
  tags:
    - infra-docker
  script:
    - export IMAGE="172.25.254.105/cloudshop/cloudshop-ci-test:${CI_COMMIT_SHORT_SHA}"
    - echo "$HARBOR_PASSWORD" | docker login --username "$HARBOR_USER" --password-stdin 172.25.254.105
    - docker build -t "$IMAGE" cicd/image-test
    - docker push "$IMAGE"
    - docker logout 172.25.254.105

deploy-to-kubernetes:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  tags:
    - infra-docker
  resource_group: cloudshop-ci-production
  script:
    - export KUBECONFIG=/tmp/cloudshop-kubeconfig
    - export IMAGE="172.25.254.105/cloudshop/cloudshop-ci-test:${CI_COMMIT_SHORT_SHA}"
    - export LATEST_SHA="$(git ls-remote origin refs/heads/main 2>/dev/null | awk '{print $1}')"
    - if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$CI_COMMIT_SHA" ]; then echo "Skipping superseded commit $CI_COMMIT_SHA; main is $LATEST_SHA"; exit 0; fi
    - kubectl set image deployment/cloudshop-ci-test nginx="$IMAGE" -n cloudshop-ci
    - kubectl rollout status deployment/cloudshop-ci-test -n cloudshop-ci --timeout=120s
    - kubectl get deployment cloudshop-ci-test -n cloudshop-ci -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

build-cloudshop-api:
  stage: build
  tags:
    - infra-docker
  script:
    - export IMAGE="172.25.254.105/cloudshop/cloudshop-api:${CI_COMMIT_SHORT_SHA}"
    - echo "$HARBOR_PASSWORD" | docker login --username "$HARBOR_USER" --password-stdin 172.25.254.105
    - docker build -t "$IMAGE" apps/cloudshop-api
    - docker push "$IMAGE"
    - docker logout 172.25.254.105

deploy-cloudshop-foundation:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  tags:
    - infra-docker
  resource_group: cloudshop-foundation-production
  script:
    - export KUBECONFIG=/tmp/cloudshop-kubeconfig
    - ': "${CLOUDSHOP_MYSQL_ROOT_PASSWORD:?CLOUDSHOP_MYSQL_ROOT_PASSWORD must be configured as a masked CI variable}"'
    - ': "${CLOUDSHOP_MYSQL_PASSWORD:?CLOUDSHOP_MYSQL_PASSWORD must be configured as a masked CI variable}"'
    - ': "${CLOUDSHOP_REDIS_PASSWORD:?CLOUDSHOP_REDIS_PASSWORD must be configured as a masked CI variable}"'
    - ': "${CLOUDSHOP_ADMIN_EMAIL:?CLOUDSHOP_ADMIN_EMAIL must be configured as a masked CI variable}"'
    - ': "${CLOUDSHOP_ADMIN_PASSWORD:?CLOUDSHOP_ADMIN_PASSWORD must be configured as a masked CI variable}"'
    - kubectl apply -f kubernetes/middleware/namespace.yaml
    - kubectl apply -f kubernetes/apps/namespace.yaml
    - kubectl create secret generic cloudshop-db-secret -n cloudshop-data --from-literal=MYSQL_ROOT_PASSWORD="$CLOUDSHOP_MYSQL_ROOT_PASSWORD" --from-literal=MYSQL_PASSWORD="$CLOUDSHOP_MYSQL_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl create secret generic cloudshop-cache-secret -n cloudshop-data --from-literal=REDIS_PASSWORD="$CLOUDSHOP_REDIS_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl create secret docker-registry harbor-registry-secret -n cloudshop-app --docker-server=172.25.254.105 --docker-username="$HARBOR_USER" --docker-password="$HARBOR_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl create secret generic cloudshop-admin-secret -n cloudshop-app --from-literal=CLOUDSHOP_ADMIN_EMAIL="$CLOUDSHOP_ADMIN_EMAIL" --from-literal=CLOUDSHOP_ADMIN_PASSWORD="$CLOUDSHOP_ADMIN_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl apply -f kubernetes/middleware/mysql-statefulset.yaml
    - kubectl apply -f kubernetes/middleware/redis.yaml
    - kubectl rollout status statefulset/mysql -n cloudshop-data --timeout=300s
    - kubectl rollout status statefulset/redis -n cloudshop-data --timeout=180s
    - kubectl apply -f kubernetes/middleware/mysql-logical-backup.yaml

deploy-cloudshop-api:
  stage: deploy
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  tags:
    - infra-docker
  resource_group: cloudshop-api-production
  needs:
    - build-cloudshop-api
    - deploy-cloudshop-foundation
  script:
    - export KUBECONFIG=/tmp/cloudshop-kubeconfig
    - export IMAGE="172.25.254.105/cloudshop/cloudshop-api:${CI_COMMIT_SHORT_SHA}"
    - export LATEST_SHA="$(git ls-remote origin refs/heads/main 2>/dev/null | awk '{print $1}')"
    - if [ -n "$LATEST_SHA" ] && [ "$LATEST_SHA" != "$CI_COMMIT_SHA" ]; then echo "Skipping superseded commit $CI_COMMIT_SHA; main is $LATEST_SHA"; exit 0; fi
    - kubectl apply -f kubernetes/apps/cloudshop-api.yaml
    - kubectl apply -f kubernetes/apps/cloudshop-api-monitoring.yaml
    - kubectl set image deployment/cloudshop-api cloudshop-api="$IMAGE" -n cloudshop-app
    - kubectl rollout status deployment/cloudshop-api -n cloudshop-app --timeout=180s
    - kubectl get deployment cloudshop-api -n cloudshop-app -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'

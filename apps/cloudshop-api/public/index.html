<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CloudShop Catalog</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">CloudShop</p>
        <h1>Catalog</h1>
      </div>
      <div class="header-actions">
        <button class="secondary-action" type="button" id="auth-button">Sign in</button>
        <button class="primary-action" type="button" id="open-product-form" disabled>Add product</button>
      </div>
    </header>
    <main>
      <section class="catalog-controls" aria-label="Product filters">
        <label>
          Category
          <select id="category-filter"><option value="">All categories</option></select>
        </label>
        <button class="icon-button" type="button" id="refresh-products" title="Refresh catalog" aria-label="Refresh catalog">R</button>
      </section>
      <p class="status" id="catalog-status" role="status"></p>
      <section class="product-grid" id="product-grid" aria-live="polite"></section>
    </main>

    <dialog id="product-dialog">
      <form id="product-form" method="dialog">
        <div class="dialog-heading">
          <h2>Add product</h2>
          <button class="icon-button" type="button" id="close-product-form" title="Close" aria-label="Close">X</button>
        </div>
        <label>Name<input name="name" maxlength="120" required></label>
        <label>Price<input name="price" type="number" min="0" step="0.01" required></label>
        <label>Category<input name="category" maxlength="80" value="General" required></label>
        <label>Stock<input name="stock" type="number" min="0" step="1" value="0" required></label>
        <label>Image URL<input name="imageUrl" type="url" placeholder="https://..."></label>
        <label>Description<textarea name="description" maxlength="2000" rows="3"></textarea></label>
        <p class="form-error" id="form-error" role="alert"></p>
        <button class="primary-action" type="submit">Create product</button>
      </form>
    </dialog>
    <dialog id="auth-dialog">
      <form id="auth-form" method="dialog">
        <div class="dialog-heading">
          <h2>Sign in</h2>
          <button class="icon-button" type="button" id="close-auth-form" title="Close" aria-label="Close">X</button>
        </div>
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <p class="form-error" id="auth-error" role="alert"></p>
        <button class="primary-action" type="submit">Sign in</button>
      </form>
    </dialog>
    <script src="/app.js"></script>
  </body>
</html>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudshop-api
  namespace: cloudshop-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudshop-api
  template:
    metadata:
      labels:
        app: cloudshop-api
    spec:
      imagePullSecrets:
        - name: harbor-registry-secret
      containers:
        - name: cloudshop-api
          image: 172.25.254.105/cloudshop/cloudshop-api:bootstrap-20260815174133
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MYSQL_HOST
              value: mysql.cloudshop-data.svc.cluster.local
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: cloudshop
            - name: MYSQL_USER
              value: cloudshop
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudshop-db-secret
                  key: MYSQL_PASSWORD
            - name: REDIS_HOST
              value: redis.cloudshop-data.svc.cluster.local
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudshop-cache-secret
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cloudshop-api
  labels:
    app: cloudshop-api
  namespace: cloudshop-app
spec:
  selector:
    app: cloudshop-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudshop-api
  namespace: cloudshop-app
spec:
  ingressClassName: nginx
  rules:
    - host: api.cloudshop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudshop-api
                port:
                  number: 80

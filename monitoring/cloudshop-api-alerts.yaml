---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudshop-api-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: cloudshop-api
      rules:
        - alert: CloudShopAPIUnavailable
          expr: sum(up{namespace="cloudshop-app",service="cloudshop-api"}) < 1
          for: 2m
          labels:
            severity: critical
            service: cloudshop-api
          annotations:
            summary: CloudShop API is unavailable
            description: No healthy CloudShop API target has been detected for 2 minutes.
            runbook_url: https://gitlab.cloudshop.local/cloudshop/cloudshop-ops/-/blob/main/docs/runbooks/cloudshop-api.md
        - alert: CloudShopAPIScrapeMissing
          expr: absent(up{namespace="cloudshop-app",service="cloudshop-api"})
          for: 5m
          labels:
            severity: warning
            service: cloudshop-api
          annotations:
            summary: CloudShop API metrics target is missing
            description: Prometheus cannot find the CloudShop API metrics target for 5 minutes.
            runbook_url: https://gitlab.cloudshop.local/cloudshop/cloudshop-ops/-/blob/main/docs/runbooks/cloudshop-api.md
        - alert: CloudShopAPIHigh5xxRate
          expr: |
            (
              sum(rate(cloudshop_api_http_request_duration_seconds_count{namespace="cloudshop-app",service="cloudshop-api",status_code=~"5.."}[5m]))
              /
              clamp_min(sum(rate(cloudshop_api_http_request_duration_seconds_count{namespace="cloudshop-app",service="cloudshop-api"}[5m])), 0.001)
            ) > 0.05
            and
            sum(rate(cloudshop_api_http_request_duration_seconds_count{namespace="cloudshop-app",service="cloudshop-api"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            service: cloudshop-api
          annotations:
            summary: CloudShop API 5xx rate is high
            description: More than 5 percent of CloudShop API requests have returned 5xx for 5 minutes.
            runbook_url: https://gitlab.cloudshop.local/cloudshop/cloudshop-ops/-/blob/main/docs/runbooks/cloudshop-api.md
        - alert: CloudShopAPIHighP95Latency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(cloudshop_api_http_request_duration_seconds_bucket{namespace="cloudshop-app",service="cloudshop-api"}[5m])
              )
            ) > 0.5
          for: 10m
          labels:
            severity: warning
            service: cloudshop-api
          annotations:
            summary: CloudShop API p95 latency is high
            description: CloudShop API p95 request latency has exceeded 500 milliseconds for 10 minutes.
            runbook_url: https://gitlab.cloudshop.local/cloudshop/cloudshop-ops/-/blob/main/docs/runbooks/cloudshop-api.md

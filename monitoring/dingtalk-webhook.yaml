apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-webhook-dingtalk
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus-webhook-dingtalk
  template:
    metadata:
      labels:
        app: prometheus-webhook-dingtalk
    spec:
      containers:
        - name: webhook-dingtalk
          image: timonwong/prometheus-webhook-dingtalk:v2.1.0
          args:
            - --config.file=/etc/prometheus-webhook-dingtalk/config.yml
          ports:
            - containerPort: 8060
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus-webhook-dingtalk/config.yml
              subPath: config.yml
      volumes:
        - name: config
          secret:
            secretName: dingtalk-webhook-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-webhook-dingtalk
  namespace: monitoring
spec:
  selector:
    app: prometheus-webhook-dingtalk
  ports:
    - port: 8060
      targetPort: 8060
